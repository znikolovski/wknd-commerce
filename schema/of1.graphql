extend type Query {
  of1Discovery(query: String!, history: [String!] = []): Of1Discovery!
}

type Of1Discovery {
  experience: String!
  heading: String!
  explanation: String!
  maxPrice: Float
  subject: String!
  products: [ProductView!]!
  adventureSlugs: [String!]!
  suggestions: [Of1Suggestion!]!
}

type Of1Suggestion {
  label: String!
  query: String!
}
