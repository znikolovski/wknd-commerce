extend type Query {
  """
  Signed-in shopper's cart-recovery offer status for one of their carts. Server-evaluated
  operational cohort (inactive 55 minutes to 7 days, no purchase since); read-only.
  """
  wkndRecoveryOffer(cart_id: String!): WkndRecoveryOffer!
  "Stage mock-Commerce planner benefit; automatic selection, no claim/apply mutation."
  wkndPlannerOffer(cart_id: String!): WkndRecoveryOffer!
}

extend type Discount {
  wknd_bundle_id: String
  wknd_experiment_id: String
}

extend type Mutation {
  """
  Issues the signed-in shopper's cart-recovery entitlement when eligible (idempotent). The
  discount is applied only when the shopper applies the returned coupon code to that cart.
  """
  claimWkndRecoveryOffer(cart_id: String!): WkndRecoveryOffer!
  """
  Applies the signed-in shopper's recovery offer to exactly the cart state they reviewed.
  Errors (extensions.code): CART_CHANGED when expected_cart_version is not the current version
  or the cart changed during the write; OFFER_NOT_BETTER when the current promotion already
  saves as much or more; RECOVERY_OFFER_UNAVAILABLE otherwise. Nothing is written on error.
  Claims the entitlement first if it was only ELIGIBLE.
  """
  applyWkndRecoveryOffer(cart_id: String!, expected_cart_version: String!): WkndRecoveryOfferApplication!
  """
  Removes the recovery offer's coupon from exactly the reviewed cart state. Leaves any other
  coupon alone (NOT_APPLIED). Never revokes the entitlement or a redemption. Errors:
  CART_CHANGED.
  """
  removeWkndRecoveryOffer(cart_id: String!, expected_cart_version: String!): WkndRecoveryOfferApplication!
}

extend type Cart {
  "Opaque concurrency token for this cart state; changes on every cart write. Pass it back as expected_cart_version."
  wknd_cart_version: String!
  "The same normalized planner offer as wkndPlannerOffer; CLAIMED means automatically selected."
  wknd_planner_offer: WkndRecoveryOffer!
}

enum WkndRecoveryOfferApplicationOutcome {
  APPLIED
  ALREADY_APPLIED
  REMOVED
  NOT_APPLIED
}

type WkndRecoveryOfferApplication {
  outcome: WkndRecoveryOfferApplicationOutcome!
  "The cart after the call (its wknd_cart_version is the new reviewed state)."
  cart: Cart!
}

enum WkndRecoveryOfferStatus {
  SIGN_IN_REQUIRED
  UNAVAILABLE
  INELIGIBLE
  ELIGIBLE
  CLAIMED
  REDEEMED
}

type WkndRecoveryOffer {
  "climbing_planner for the Stage automatic planner benefit; absent on recovery offers."
  kind: String
  status: WkndRecoveryOfferStatus!
  reason: String
  coupon_code: String
  percent_off: Float
  max_discount: Money
  expires_at: String
  "What this offer would take off the cart now, computed by the promotion engine (display only)."
  saving: Money
  "What the cart's currently applied promotion takes off, for comparison with saving."
  current_saving: Money
  message: String
}

extend type Customer {
  "Explicit opt-in to one cart-reminder email per inactive cart (never inferred from sign-in or checkout)."
  wknd_recovery_email_opt_in: Boolean!
  "Separate explicit opt-in to WKND news & offers emails (never implied by cart-reminder consent)."
  wknd_marketing_email_opt_in: Boolean!
  "Verified destination observations for this shopper; display-only, never financial authorization. Empty while disabled."
  wknd_aam_memberships: [WkndAamMembership!]!
}

enum WkndAamMembershipStatus {
  UNKNOWN
  MEMBER
  WITHDRAWN
}

type WkndAamMembership {
  segment_id: String!
  status: WkndAamMembershipStatus!
  expires_at: String
  financial_authorization: Boolean!
}

"Where the shopper gave or withdrew consent."
enum WkndConsentSource {
  WEB
  IOS
}

extend type Mutation {
  "Signed-in customer sets the cart-reminder email preference (not available to delegated agents)."
  setWkndRecoveryEmailOptIn(opt_in: Boolean!, wording_version: String, source: WkndConsentSource = WEB): Boolean!
  """
  Signed-in customer sets the WKND news & offers email preference. Opting in requires the
  wording_version of the consent text the shopper saw. Not available to delegated agents.
  """
  setWkndMarketingEmailOptIn(opt_in: Boolean!, wording_version: String, source: WkndConsentSource = WEB): Boolean!
}
