# WKND Commerce — mock Adobe Commerce backend (API Mesh source), AEM image linking,
# PDP prerendering, Content AI search proxy and the admin UI (dx/excshell/1).
# Values come from .env (see .env.example) and are injected as default action inputs.
application:
  hooks:
    # Fail closed: refuse to deploy when a promotion gate or identity input is missing in .env.
    pre-app-deploy: node scripts/check-deploy-env.mjs
  runtimeManifest:
    database:
      auto-provision: true
      region: amer
    packages:
      commerce:
        license: Apache-2.0
        inputs:
          LOG_LEVEL: info
          AEM_AUTHOR_URL: $WKND_AEM_AUTHOR_URL
          AEM_PRODUCTS_ROOT: $WKND_AEM_PRODUCTS_ROOT
          SITE_ORIGIN: $WKND_SITE_ORIGIN
          PLACEHOLDER_IMAGE: $WKND_PLACEHOLDER_IMAGE
          HLX_ORG: $WKND_HLX_ORG
          HLX_SITE: $WKND_HLX_SITE
          HLX_ADMIN_API_KEY: $WKND_HLX_ADMIN_API_KEY
        actions:
          storefront-graphql:
            function: actions/storefront-graphql/index.js
            runtime: nodejs:22
            web: 'raw'
            inputs:
              AUTH0_ISSUER: $WKND_AUTH0_ISSUER
              AUTH0_AUDIENCE: $WKND_AUTH0_AUDIENCE
              ALLOWED_ORIGINS: $WKND_ALLOWED_ORIGINS
              # Delegated shopper assertions from the WKND LLM app (ChatGPT); both must be set
              MCP_DELEGATION_ISSUER: $WKND_MCP_DELEGATION_ISSUER
              MCP_DELEGATION_SECRET: $WKND_MCP_DELEGATION_SECRET
              # Rotation overlap only: the previous secret, accepted until cleared (empty = off)
              MCP_DELEGATION_SECRET_PREVIOUS: $WKND_MCP_DELEGATION_SECRET_PREVIOUS
              # API Mesh introspects this source when the mesh is created/updated.
              ALLOW_INTROSPECTION: 'true'
              CATALOG_MAX_AGE: 60
              RECOVERY_REDEMPTION_VERIFIED: $WKND_RECOVERY_REDEMPTION_VERIFIED
              PROMOTION_SELECTION: $WKND_PROMOTION_SELECTION
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              web-custom-options: true
              final: true
            limits:
              timeout: 30000
              memorySize: 512
          auth-config:
            function: actions/auth-config/index.js
            runtime: nodejs:22
            web: 'yes'
            inputs:
              AUTH0_ISSUER: $WKND_AUTH0_ISSUER
              AUTH0_AUDIENCE: $WKND_AUTH0_AUDIENCE
              AUTH0_CLIENT_ID: $WKND_AUTH0_CLIENT_ID
            annotations:
              require-adobe-auth: false
              final: true
          mcp:
            function: actions/commerce-mcp/index.js
            runtime: nodejs:22
            web: 'raw'
            inputs:
              MCP_SHARED_SECRET: $WKND_COMMERCE_MCP_SECRET
              MCP_ORG_ID: $WKND_COMMERCE_MCP_ORG
              MCP_ALLOWED_ORIGINS: $WKND_COMMERCE_MCP_ALLOWED_ORIGINS
              MCP_PROMOTION_WRITES_ENABLED: $WKND_MCP_PROMOTION_WRITES_ENABLED
              PROMOTION_CURSOR_KEY: $WKND_PROMOTION_CURSOR_KEY
              RECOVERY_REDEMPTION_VERIFIED: $WKND_RECOVERY_REDEMPTION_VERIFIED
              PROMOTION_SELECTION: $WKND_PROMOTION_SELECTION
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              web-custom-options: true
              final: true
            limits:
              timeout: 120000
              memorySize: 512
          promotions-worker:
            function: actions/promotions-worker/index.js
            runtime: nodejs:22
            web: 'no'
            inputs:
              RECOVERY_REDEMPTION_VERIFIED: $WKND_RECOVERY_REDEMPTION_VERIFIED
              PROMOTION_SELECTION: $WKND_PROMOTION_SELECTION
              BREVO_API_KEY: $WKND_BREVO_API_KEY
              BREVO_RECOVERY_TEMPLATE_ID: $WKND_BREVO_RECOVERY_TEMPLATE_ID
              SHOP_CART_URL: $WKND_SHOP_CART_URL
              RECOVERY_EMAIL_ALLOWLIST: $WKND_RECOVERY_EMAIL_ALLOWLIST
              RECOVERY_EMAIL_DAILY_BUDGET: $WKND_RECOVERY_EMAIL_DAILY_BUDGET
            annotations:
              include-ims-credentials: true
            limits:
              timeout: 120000
              memorySize: 512
          brevo-webhook:
            function: actions/brevo-webhook/index.js
            runtime: nodejs:22
            web: 'raw'
            inputs:
              BREVO_WEBHOOK_TOKEN: $WKND_BREVO_WEBHOOK_TOKEN
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
            limits:
              timeout: 30000
              memorySize: 512
          # Environment-bound Target AAM diagnostic + separate ID-linkage consent (no financial use).
          # Optional inputs deploy empty = OFF; exact platform-verified namespace mapping is required.
          # docs/TARGET-AAM-DIAGNOSTIC.md
          target-diagnostic:
            function: actions/target-diagnostic/index.js
            runtime: nodejs:22
            web: 'raw'
            inputs:
              AUTH0_ISSUER: $WKND_AUTH0_ISSUER
              AUTH0_AUDIENCE: $WKND_AUTH0_AUDIENCE
              TARGET_DIAG_ENABLED: $WKND_TARGET_DIAG_ENABLED
              TARGET_DIAG_ENVIRONMENT: $WKND_TARGET_DIAG_ENVIRONMENT
              TARGET_DIAG_STAGE_NAMESPACE: $WKND_TARGET_DIAG_STAGE_NAMESPACE
              TARGET_DIAG_PRODUCTION_NAMESPACE: $WKND_TARGET_DIAG_PRODUCTION_NAMESPACE
              TARGET_DIAG_TARGET_CONFIG_APPROVED: $WKND_TARGET_DIAG_TARGET_CONFIG_APPROVED
              TARGET_DIAG_ALLOWED_ORIGINS: $WKND_TARGET_DIAG_ALLOWED_ORIGINS
              TARGET_DIAG_SHOPPER_KEYS: $WKND_TARGET_DIAG_SHOPPER_KEYS
              TARGET_DIAG_TIMEOUT_MS: $WKND_TARGET_DIAG_TIMEOUT_MS
              TARGET_CLIENT_CODE: $WKND_TARGET_CLIENT_CODE
              TARGET_PROPERTY_TOKEN: $WKND_TARGET_PROPERTY_TOKEN
              TARGET_ID_LINKAGE_ENABLED: $WKND_TARGET_ID_LINKAGE_ENABLED
              TARGET_ID_LINKAGE_WORDING_VERSIONS: $WKND_TARGET_ID_LINKAGE_WORDING_VERSIONS
              TARGET_ID_BINDING_STORE_APPROVED: $WKND_TARGET_ID_BINDING_STORE_APPROVED
              TARGET_ID_SERVICE_ENABLED: $WKND_TARGET_ID_SERVICE_ENABLED
              TARGET_ID_RETIREMENT_ENABLED: $WKND_TARGET_ID_RETIREMENT_ENABLED
              TARGET_ID_ORG_ID: $WKND_TARGET_ID_ORG_ID
              TARGET_ID_DPID: $WKND_TARGET_ID_DPID
              TARGET_ID_LEASE_MS: $WKND_TARGET_ID_LEASE_MS
              TARGET_ID_TIMEOUT_MS: $WKND_TARGET_ID_TIMEOUT_MS
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              web-custom-options: true
              final: true
            limits:
              timeout: 30000
              memorySize: 256
          pdp-markup:
            function: actions/pdp-markup/index.js
            runtime: nodejs:22
            web: 'raw'
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          prerender:
            function: actions/prerender/index.js
            runtime: nodejs:22
            web: 'no'
            inputs:
              PDP_PUBLISH: $WKND_PDP_PUBLISH
              PDP_MARKUP_URL: $WKND_PDP_MARKUP_URL
            annotations:
              include-ims-credentials: true
            limits:
              timeout: 300000
          content-ai:
            function: actions/content-ai/index.js
            runtime: nodejs:22
            web: 'raw'
            inputs:
              CONTENT_AI_URL: $WKND_CONTENT_AI_URL
              CONTENT_AI_SOURCE: $WKND_CONTENT_AI_SOURCE
              ALLOWED_ORIGINS: $WKND_ALLOWED_ORIGINS
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              web-custom-options: true
              final: true
            limits:
              timeout: 30000
          asset-to-product:
            function: actions/asset-to-product/index.js
            runtime: nodejs:22
            web: 'yes'
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          product-to-asset:
            function: actions/product-to-asset/index.js
            runtime: nodejs:22
            web: 'yes'
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true
          asset-events:
            function: actions/asset-events/index.js
            runtime: nodejs:22
            web: 'no'
            annotations:
              include-ims-credentials: true
            # Bulk uploads fire hundreds of events at once; each activation loads the catalog,
            # so cap per-container concurrency (Runtime scales out) to avoid OOM-killed containers.
            limits:
              timeout: 60000
              memorySize: 512
              concurrency: 10
          reconcile:
            function: actions/reconcile/index.js
            runtime: nodejs:22
            web: 'no'
            annotations:
              include-ims-credentials: true
            limits:
              timeout: 300000
          pdp-scheduler:
            function: actions/pdp-scheduler/index.js
            runtime: nodejs:22
            web: 'no'
            inputs:
              PDP_PUBLISH: $WKND_PDP_PUBLISH
            annotations:
              include-ims-credentials: true
            limits:
              timeout: 60000
        triggers:
          nightly-reconcile:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '30 15 * * *'
          pdp-scheduler-tick:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/15 * * * *'
          promotions-worker-tick:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/5 * * * *'
        rules:
          nightly-reconcile-rule:
            trigger: nightly-reconcile
            action: reconcile
          pdp-scheduler-rule:
            trigger: pdp-scheduler-tick
            action: pdp-scheduler
          promotions-worker-rule:
            trigger: promotions-worker-tick
            action: promotions-worker
extensions:
  aem/assets/assetsview/1:
    $include: src/aem-assets-assetsview-1/ext.config.yaml
  dx/excshell/1:
    $include: src/dx-excshell-1/ext.config.yaml
