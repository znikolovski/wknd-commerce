packages:
  commerce-admin:
    license: Apache-2.0
    inputs:
      LOG_LEVEL: info
      ADMIN_IMS_ORG: $WKND_ADMIN_IMS_ORG
      AEM_AUTHOR_URL: $WKND_AEM_AUTHOR_URL
      AEM_PRODUCTS_ROOT: $WKND_AEM_PRODUCTS_ROOT
      CONTENT_AI_URL: $WKND_CONTENT_AI_URL
      CONTENT_AI_SOURCE: $WKND_CONTENT_AI_SOURCE
      PRERENDER_ACTION: commerce/prerender
    actions:
      admin:
        function: ../actions/admin/index.js
        web: 'yes'
        runtime: nodejs:22
        annotations:
          require-adobe-auth: true
          include-ims-credentials: true
          final: true
        limits:
          timeout: 120000
          memorySize: 512
      promotions:
        function: ../actions/promotions-admin/index.js
        web: 'yes'
        runtime: nodejs:22
        inputs:
          AUTH0_ISSUER: $WKND_AUTH0_ISSUER
          AUTH0_AUDIENCE: $WKND_AUTH0_AUDIENCE
          STAGE_AAM_GENERAL_OFFERS_ENABLED: $WKND_STAGE_AAM_GENERAL_OFFERS_ENABLED
          TARGET_DIAG_ENABLED: $WKND_TARGET_DIAG_ENABLED
          TARGET_DIAG_ENVIRONMENT: $WKND_TARGET_DIAG_ENVIRONMENT
          TARGET_DIAG_STAGE_NAMESPACE: $WKND_TARGET_DIAG_STAGE_NAMESPACE
          TARGET_DIAG_PRODUCTION_NAMESPACE: $WKND_TARGET_DIAG_PRODUCTION_NAMESPACE
          TARGET_DIAG_TARGET_CONFIG_APPROVED: $WKND_TARGET_DIAG_TARGET_CONFIG_APPROVED
          TARGET_DIAG_SHOPPER_KEYS: $WKND_TARGET_DIAG_SHOPPER_KEYS
          TARGET_DIAG_TIMEOUT_MS: $WKND_TARGET_DIAG_TIMEOUT_MS
          TARGET_CLIENT_CODE: $WKND_TARGET_CLIENT_CODE
          TARGET_PROPERTY_TOKEN: $WKND_TARGET_PROPERTY_TOKEN
          TARGET_ID_LINKAGE_ENABLED: $WKND_TARGET_ID_LINKAGE_ENABLED
          TARGET_ID_LINKAGE_WORDING_VERSIONS: $WKND_TARGET_ID_LINKAGE_WORDING_VERSIONS
          TARGET_ID_BINDING_STORE_APPROVED: $WKND_TARGET_ID_BINDING_STORE_APPROVED
          TARGET_ID_SERVICE_ENABLED: $WKND_TARGET_ID_SERVICE_ENABLED
          TARGET_ID_ORG_ID: $WKND_TARGET_ID_ORG_ID
          TARGET_ID_DPID: $WKND_TARGET_ID_DPID
          TARGET_ID_LEASE_MS: $WKND_TARGET_ID_LEASE_MS
          TARGET_ID_TIMEOUT_MS: $WKND_TARGET_ID_TIMEOUT_MS
          PROMOTION_CURSOR_KEY: $WKND_PROMOTION_CURSOR_KEY
          PROMOTION_SELECTION: $WKND_PROMOTION_SELECTION
          RECOVERY_REDEMPTION_VERIFIED: $WKND_RECOVERY_REDEMPTION_VERIFIED
          BREVO_RECOVERY_TEMPLATE_ID: $WKND_BREVO_RECOVERY_TEMPLATE_ID
          RECOVERY_EMAIL_ALLOWLIST: $WKND_RECOVERY_EMAIL_ALLOWLIST
          RECOVERY_EMAIL_DAILY_BUDGET: $WKND_RECOVERY_EMAIL_DAILY_BUDGET
        annotations:
          require-adobe-auth: true
          include-ims-credentials: true
          final: true
        limits:
          timeout: 60000
          memorySize: 512
  commerce-assets:
    license: Apache-2.0
    inputs:
      LOG_LEVEL: info
      ADMIN_IMS_ORG: $WKND_ADMIN_IMS_ORG
      AEM_AUTHOR_URL: $WKND_AEM_AUTHOR_URL
      AEM_PRODUCTS_ROOT: $WKND_AEM_PRODUCTS_ROOT
      PRERENDER_ACTION: commerce/prerender
    actions:
      manage:
        function: ../actions/assets-panel/index.js
        web: 'yes'
        runtime: nodejs:22
        annotations:
          require-adobe-auth: true
          include-ims-credentials: true
          final: true
        limits:
          timeout: 60000
          memorySize: 512
