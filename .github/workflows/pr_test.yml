name: AIO App CI

# Pull-request checks run the project's unit/contract tests and lint. They need no Adobe IMS
# credentials or Runtime namespace (those are only required by deploy workflows), so the job
# does not log in to Adobe and cannot fail on missing deploy secrets.
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Test PR
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20']
        os: [macOS-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
